 table .decline{

<body>

    </section>

    <script src="script.js"></script>
 <script>
        function approvePopup(id){
            
    document.getElementById("popup-1").classList.toggle("active");
    document.getElementById("aid").value = id;
    
    }
    function togglePopup(){
    document.getElementById("popup-1").classList.toggle("active");
    }
    function declinePopup(id){
        
    document.getElementById("popup-2").classList.toggle("active");
    document.getElementById("did").value = id;
    
    }
    function togglePopup2(){
    document.getElementById("popup-2").classList.toggle("active");
    }
          
    document.getElementById("load").style.display="initial";
            document.getElementById("loader").style.display="block"; 
            document.getElementById("message").textContent = "Fetching Responses....";
            function fetchd (){
       
       var details ="";
       fetch(
    
    "https://script.google.com/macros/s/AKfycbwvEUmJ6EuyT9obS4yArsV10S7eIPyQj_DOnQ53-gDf7Ry5Ayrwr7q6-5Q8nrYHamkJ/exec",
    {
      redirect: "follow",
      method: "POST",
      body: "uname",
      headers: {
        "Content-Type": "text/plain;charset=utf-8",
      },
    }
   )
   
    .then(function (response) {
   
      // Check if the request was successful
      if (response) {
   
        return response; // Assuming your script returns JSON response
      } else {
        throw new Error("Failed to fetch.");
      }
    })
    .then(async function (data) {
   const result1 = await data.json();
   
   var r = result1.data2[0];
   var heads = result1.data2[1][0];
   var sr = JSON.stringify(r);
   var sheads = JSON.stringify(heads);
   sessionStorage.setItem("detailheads",sheads);
   sessionStorage.setItem("detaildatas",sr);


var hindex = heads.findIndex(x => x == "Team Number"); 
var headth ="" ;
for(var b=0; b<heads.length;b++){
var temp =
`<th><b>`+heads[b]+`</b></th>
`;
headth+=temp;
}
var theadth = 
`<thead>
  `+headth+`
 <th><b>Full Info</b></th> 
</thead>
`;

   for(var k=0; k<r.length-1;k++){
  
    const searchdata = document.querySelector('.input-group input');
    if(searchdata.value==""){
      
      var detail = createtable(r[k]);
      details = details +"<tr>" +detail+`<td><button class="btn" style="background-color: #d78623;padding:5px;" onclick=" window.open('/details/index.html?team=`+r[k][hindex]+`', '_blank')" href="">View Details</button></td>`+"</tr>";
    }
    else{
var tabledata = r[k].join("");
var tdata =tabledata.toLowerCase();
var sdata =searchdata.value.toLowerCase();
if (tdata.includes(sdata)){
 var detail = createtable(r[k]);
 details = details +"<tr>" +detail+`<td><button class="btn" style="background-color: #d78623;padding:5px;" onclick=" window.open('/details/index.html?team=`+r[k][hindex]+`', '_blank')" href="">View Details</button></td>`+"</tr>";
}
    }

    
    function createtable(r){
      
      var detail ="";
      for(var j=0; j<r.length;j++){
        
        var value = String (r[j]);
        
        if (value.includes("drive.google.com")){
          var vdetail =
`<td><a href="`+r[j]+`">View</a></td>
`;
        }
        else{
          var raw =String (r[j]);
  
          if (raw.includes("\n")){
         
          
          
  var graw  = raw.split("\n");
     
     var hhp = graw.join("<br>");

          var vdetail =
`<td>`+hhp+`</td>
`;
}
else{
  var vdetail =
`<td>`+r[j]+`</td>
`;
}
        }

detail += vdetail
      }
       return detail;
      }
      

   }
   var tdata = 
`
<tbody>
  `+details+`
</<tbody>
`;


   if (details!==""){
 
   document.getElementById("tabdetails").innerHTML = theadth + tdata;
   document.getElementById("tablebee").style.display = "initial";
   document.getElementById("status").style.display = "none";
   }
   else{
     document.getElementById("tablebee").style.display = "none";
       document.getElementById("status").style.display = "initial";
       document.getElementById("status").textContent = "No Responses";

   }
   document.getElementById("loader").style.display="none"; 
                   document.getElementById("message").textContent = "";
                   document.getElementById("load").style.display = "none";

  
   })
   
   .catch(function (error) {
   // Handle errors, you can display an error message here
   console.error(error);
   document.getElementById("loader").style.display="none"; 
   document.getElementById("message").textContent =
   "Failed to fetch.";
   document.getElementById("message").style.display = "block";
   });
      }
       fetchd ();
       setInterval(() => {
        fetchd ();
  }, 1000)
