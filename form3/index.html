<script>
  let form = document.querySelector("form");
form.addEventListener('submit',()=>{ {
  document.getElementById("load").style.display="initial";
  document.getElementById("loader").style.display="block"; 
  document.getElementById("bt").style.display="none";
}})
  
document.getElementById("form").addEventListener("submit", function (e) {
        e.preventDefault(); // Prevent the default form submission
        document.getElementById("message").textContent = "Submitting..";
        document.getElementById("message").style.display = "block";
        document.getElementById("bt").disabled = true;

        // Collect the form data
        var formData = new FormData(this);
        var keyValuePairs = [];
        for (var pair of formData.entries()) { 
     
          if (pair[0] !== "file"){
            
          
          keyValuePairs.push(pair[0] + "=val=" + pair[1]);
console.log(pair[0])
        }}

        var formDataString = keyValuePairs.join("=namff=");
console.log(formDataString)

        // Send a POST request to your Google Apps Script
        fetch(
          "https://script.google.com/macros/s/AKfycbxW9LG5yz3NG6s9rUT9lEOuMOVrlLm-b2sX56ftirXLIUSoCmfyEA9_xPLc1-3YHQyAUQ/exec",
          {
            redirect: "follow",
            method: "POST",
            body: formDataString+"=sheetid="+"1q4plNnvsvbOWHpSPj8dh2j70M_SNOyqNr1tmOeiq2WQ",
            headers: {
              "Content-Type": "text/plain;charset=utf-8",
            },
          }
        )

          .then(function (response) {

            // Check if the request was successful
            if (response) {
         
              return response; // Assuming your script returns JSON response
            } else {
              throw new Error("Failed to submit the form.");
            }
          })
          .then(async function (data) {
            const result1 = await data.json();
            console.log(result1.data2);
            if (result1.data2 == "accept"){
            // Display a success message
            document.getElementById("bt").disabled = false;
            document.getElementById("form").reset();
            window.location='submission.html';
            setTimeout(function () {
              document.getElementById("message").textContent = "";
              document.getElementById("message").style.display = "none";
            }, 2600);}
            else if (result1.data2 == "reject"){
              window.location='reject.html';
            }
          })

          .catch(function (error) {
            // Handle errors, you can display an error message here
            console.error(error);
            document.getElementById("message").textContent =
              "An error occurred while submitting the form.";
            document.getElementById("message").style.display = "block";
          });
      });

</script>
